name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: ./ecostride-app
        run: npm install

      - name: Build Web App
        working-directory: ./ecostride-app
        run: npm run build

      - name: Sync Capacitor
        working-directory: ./ecostride-app
        run: npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Make gradlew executable
        working-directory: ./ecostride-app/android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: ./ecostride-app/android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecostride-app-debug
          path: ecostride-app/android/app/build/outputs/apk/debug/app-debug.apk
